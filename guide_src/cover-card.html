<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; margin:0; padding:0; }
  html,body{ width:820px; height:1060px; }
  .card{
    width:820px; height:1060px; position:relative; overflow:hidden;
    background:linear-gradient(150deg,#1a1830 0%,#2a1d63 55%,#6243FA 130%);
    color:#fff; font-family:"Bricolage Grotesque","Manrope",Arial,sans-serif;
    padding:70px 66px;
    border-radius:0;
  }
  .wm{ font-size:34px; font-weight:800; letter-spacing:-1px; }
  .wm .dot{ color:#B2FF00; }
  .kick{ margin-top:150px; color:#B2FF00; font-weight:700; letter-spacing:3px; font-size:16px; text-transform:uppercase; }
  h1{ font-size:78px; line-height:1.04; letter-spacing:-2px; margin-top:14px; }
  .sub{ font-family:"Manrope",Arial,sans-serif; color:#d7d3f2; font-size:22px; margin-top:26px; max-width:600px; line-height:1.45; }
  .tag{ position:absolute; bottom:120px; left:66px; font-size:22px; font-weight:700; }
  .tag .a{ color:#B2FF00; }
  .meta{ position:absolute; left:66px; right:66px; bottom:66px; display:flex; justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.25); padding-top:18px; font-family:"Manrope",Arial,sans-serif; font-size:16px; color:#cfc9ee; }
  .pill{ display:inline-block; margin-top:20px; background:rgba(178,255,0,.14); border:1px solid rgba(178,255,0,.5);
    color:#B2FF00; font-family:"Manrope",Arial,sans-serif; font-weight:700; font-size:15px; padding:8px 16px; border-radius:40px; }
</style></head>
<body>
  <div class="card">
    <div class="wm">AppVerra<span class="dot">.</span></div>
    <div class="kick">Free Guide · 2026</div>
    <h1>The App<br>Launch<br>Checklist</h1>
    <div class="sub">Ship on the Apple App Store &amp; Google Play — from developer accounts to post-launch.</div>
    <div class="pill">✓ 5 steps · Apple + Google · PDF</div>
    <div class="tag">Apps That Ship. <span class="a">Founders Who Answer.</span></div>
    <div class="meta"><span>appverra.co</span><span>info@appverra.co</span></div>
  </div>
</body></html>
